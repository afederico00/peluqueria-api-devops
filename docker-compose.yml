services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: peluqueria-api:local
    container_name: peluqueria-api
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s