spring.application.name=peluqueria
server.port=8080

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:peluqueriadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/v3/api-docs


# MCP Server Configuration
spring.ai.mcp.server.name=peluqueria-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Servidor MCP de la app Peluqueria. Permite listar, buscar, crear, actualizar y eliminar peluqueros y turnos.

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Metricas -> Grafana Cloud (OTLP push). Credenciales solo por variables de entorno.
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_AUTH:}
management.otlp.metrics.export.step=15s
management.otlp.metrics.export.base-time-unit=seconds

# Histograma de latencia para calcular p50/p95 en el dashboard
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=5s
