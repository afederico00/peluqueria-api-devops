# Perfil de produccion (Render). Se activa con SPRING_PROFILES_ACTIVE=prod.

# La consola web de H2 no debe quedar expuesta en un entorno publico
spring.h2.console.enabled=false

# Sin banner: la salida queda 100% en JSON para la plataforma de logs
spring.main.banner-mode=off

# Render termina HTTPS en su proxy y reenvia por HTTP interno.
# Sin esto, Swagger y los redirects generan URLs http:// y el navegador las bloquea.
server.forward-headers-strategy=framework
